name: Hanwen build verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:9.7
        command: --default-time-zone=+08:00
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 127.0.0.1:14327:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Verify isolated database and import schema
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          actual=$(docker exec "$MYSQL_CONTAINER" mysql -uroot -Nse "SELECT CONCAT(@@session.time_zone,'|',@@transaction_isolation,'|',TRIM(TRAILING '/' FROM @@datadir))")
          test "$actual" = '+08:00|REPEATABLE-READ|/var/lib/mysql'
          docker exec "$MYSQL_CONTAINER" mysql -uroot -Nse "SELECT COUNT(*) AS timezone_rows FROM mysql.time_zone_name"
          python3 tests/schema_migrations_test.py --mysql-container "$MYSQL_CONTAINER" --data-dir /var/lib/mysql
      - name: Verify transactions, concurrency and file retention
        run: mvn -B -ntp -f backend/pom.xml -pl course-service,learning-service,assignment-service -am verify -Pit-db -Dhanwen.test.dataDir=/var/lib/mysql
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check publication boundaries
        run: |
          python3 tools/check_publication.py --self-test
          python3 tests/publication_guard_test.py
          python3 tools/check_publication.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Verify Java source formatting
        run: |
          curl --fail --location --retry 2 https://github.com/google/google-java-format/releases/download/v1.37.0/google-java-format-1.37.0-all-deps.jar -o "$RUNNER_TEMP/google-java-format.jar"
          echo "834b2a0c38cb774953322a84b5ca3f2f40dd3156650b3cd44d3b744345962f7a  $RUNNER_TEMP/google-java-format.jar" | sha256sum --check
          find backend -path '*/src/*' -name '*.java' -print0 | xargs -0 java -jar "$RUNNER_TEMP/google-java-format.jar" --aosp --skip-reflowing-long-strings --dry-run --set-exit-if-changed
      - name: Compile all services and run JUnit
        run: mvn -B -ntp -f backend/pom.xml package
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build frontend
        working-directory: frontend
        run: |
          npm run format:check
          npm run build
          npm test
      - name: Verify export, roster, workspace and revision comparison rules
        run: |
          node tests/export.test.mjs
          node tests/roster.test.mjs
          node tests/workspace.test.mjs
          node tests/revision-diff.test.mjs
          node --test tests/local-demo.test.mjs
      - name: Check local health state transition rules
        run: |
          python3 tests/monitor_test.py
          python3 tests/backup_test.py
      - name: Validate reading content and fixture isolation
        run: |
          python3 tools/install_academy_content.py --validate
          python3 tests/content_catalog_test.py
