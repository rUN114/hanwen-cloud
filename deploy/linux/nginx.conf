# Included by nginx inside its http block. Replace the sample hostname and TLS certificate paths.
limit_req_zone $binary_remote_addr zone=hanwen_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hanwen_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=hanwen_connections:10m;
server {
    listen 80;
    server_name hanwen.example.com;
    return 301 https://hanwen.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name hanwen.example.com;
    ssl_certificate /etc/hanwen/tls/fullchain.pem;
    ssl_certificate_key /etc/hanwen/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/hanwen/current/frontend/dist;
    index index.html;
    client_max_body_size 21m;
    limit_conn hanwen_connections 20;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /api/auth/login {
        limit_req zone=hanwen_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/ {
        limit_req zone=hanwen_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~ ^/(internal|actuator|eureka)(/|$) { return 404; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}
